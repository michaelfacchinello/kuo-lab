name: Deploy to GitHub Pages

on:
  # Manual-only: this site is intentionally kept private for now, so it does
  # NOT auto-publish on push. Run it from the Actions tab ("Run workflow") once
  # you've enabled GitHub Pages and are ready to go public. To restore
  # publish-on-push later, add back:
  #   push:
  #     branches: [main]
  workflow_dispatch:

# Least-privilege token scoped for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
